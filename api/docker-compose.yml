services:
  redis:
    command: redis-server --save 60 10
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    container_name: fastapi_app
    restart: always
    depends_on:
      db:
        condition: service_healthy  # Wait for db to be healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - API_HOST=${API_HOST}
      - GCP_SERVICE_ACCOUNT_KEY=/app/general-purpose-jobs-0216f73edded.json
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME}
    ports:
      - "${API_HOST}:8000:8000"  # Use the API_HOST in port binding
    volumes:
      - ./:/app
    networks:
      - ai_network
    command: ["./start.sh"]  # Use the startup script instead of direct uvicorn command
  celery_workers:
    build:
      context: .
      dockerfile: Dockerfile.celery  
    command: watchmedo auto-restart --directory=/app/celery_app --pattern="*.py" --recursive -- celery -A celery_app.celery_app worker --loglevel=info -c 4
    # command: "tail -f /dev/null"
    volumes:
      - .:/app
    working_dir: /app  
    depends_on:
      redis:
        condition: service_healthy  # Wait for Redis to be ready
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GCP_SERVICE_ACCOUNT_KEY=/app/general-purpose-jobs-0216f73edded.json
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME}
    networks:
      - ai_network

  db:
    image: postgres:13
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  test_db:  # Separate PostgreSQL instance for tests
    image: postgres:13
    container_name: postgres_test_db
    restart: always
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    networks:
      - ai_network
    ports:
      - "5433:5432"  # Use a different port for the test database
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:

networks:
  ai_network:
    driver: bridge